services:
  # Local OCI registry for testing
  registry:
    image: registry:3
    ports:
      - "5555:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

  # BuildKit for Copa patching
  buildkit:
    image: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    privileged: true
    ports:
      - "1234:1234"
    entrypoint:
      - buildkitd
      - --addr=tcp://0.0.0.0:1234

volumes:
  registry-data:
